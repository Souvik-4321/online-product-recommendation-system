<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🛍️ ShopSmart
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/register">Register</a>

    </div>

</nav>


<main>

    <div class="auth-container">

        <h1>Welcome Back</h1>

        <p>
            Login to your ShopSmart account
        </p>


        {% with messages =
            get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >

                Login

            </button>

        </form>


        <p class="auth-link">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</main>

</body>

</html>
